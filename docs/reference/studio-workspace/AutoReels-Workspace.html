function renderBottom(){const el=$('#bottom-content');if(!el)return;$$('[data-bottom]').forEach(b=>b.classList.toggle('active',b.dataset.bottom===state.bottomTab));let n=selectedNode();if(state.bottomTab==='properties'){if(!n){el.innerHTML=`<div class="row between"><div><h3>Thiết kế thao tác, dùng lại trên nhiều máy</h3><p class="muted smalltext" style="margin-top:6px">Chọn node để sửa. Kéo từ cổng phải sang cổng trái để nối nhánh.</p></div><span class="badge green">${graph().nodes.length} node · ${graph().edges.length} liên kết</span></div><div class="row wrap" style="margin-top:18px">${btn('inputs','table','Khai báo đầu vào','small')}${btn('validate','check','Kiểm tra workflow','small')}${btn('test-data','bug','Dữ liệu chạy thử','small')}<span class="muted smalltext">${ic('phone')} Máy kiểm thử: ${esc(dev().name)}</span></div>`;return}el.innerHTML=`<div class="row between" style="margin-bottom:10px"><div class="row"><strong>${esc(n.name)}</strong><span class="badge">${esc(n.id)}</span>${n.effect?'<span class="badge amber">Thao tác gửi / đăng</span>':''}</div><div class="row">${btn('advanced-node','settings','Nâng cao','small')}${n.type==='subflow'?btn('open-selected-sub','external','Mở khối con','small'):''}</div></div><div class="form-grid"><div><label>Tên node</label><input data-prop="name" value="${esc(n.name)}"></div><div><label>Nhận diện mục tiêu</label><select data-prop="method">${['XPath / thuộc tính','Ảnh mẫu','OCR / văn bản','Vị trí tương đối','Tọa độ'].map(t=>`<option ${n.method===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Timeout (ms)</label><input type="number" min="100" data-prop="timeout" value="${n.timeout}"></div><div><label>${n.type==='condition'?'Biểu thức điều kiện':'Giá trị / dữ liệu ánh xạ'}</label><input data-prop="value" placeholder="{{row.caption}}" value="${esc(n.value)}"></div><div><label>Selector / tiêu chí <span class="help" title="Có thể chọn trực tiếp trên điện thoại mẫu">?</span></label><div class="row"><inp function bindCanvas(){let canvas=$('#canvas');canvas.oncontextmenu=e=>{e.preventDefault();let ne=e.target.closest('[data-node]'),ee=e.target.closest('[data-edge]');if(ne&&!state.selected.includes(ne.dataset.node)){state.selected=[ne.dataset.node];renderGraph();renderBottom()}if(ee){state.edgeSelected=ee.dataset.edge;renderGraph()}showCanvasMenu(e.clientX,e.clientY,ne?'node':ee?'edge':'canvas')};canvas.ondragover=e=>e.preventDefault();canvas.ondrop=e=>{e.preventDefault();try{let d=JSON.parse(e.dataTransfer.getData('text/plain')),r=canvas.getBoundingClientRect();addNode(d.type,(e.clientX-r.left-state.pan.x)/state.zoom,(e.clientY-r.top-state.pan.y)/state.zoom,d.sub)}catch{}};canvas.onwheel=e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){let r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,old=state.zoom;state.zoom=Math.min(1.8,Math.max(.25,state.zoom*(e.deltaY>0?.9:1.1)));state.pan.x=mx-(mx-state.pan.x)*state.zoom/old;state.pan.y=my-(my-state.pan.y)*state.zoom/old}else{state.pan.x-=e.deltaX;state.pan.y-=e.deltaY}renderGraph()};canvas.onpointerdown=e=>{if(e.button===2||e.target.closest('button')||e.target.closest('.minimap'))return;let port=e.target.closest('[data-port]'),ne=e.target.closest('[data-node]'),ee=e.target.closest('[data-edge]');if(port){if(port.dataset.port==='in'&&connecting){connectNodes(connecting.a,port.dataset.nodeId,connecting.port);connecting=null;return}if(port.dataset.port!=='in'){connecting={a:port.dataset.nodeId,port:port.dataset.port};const move=ev=>{let a=graph().nodes.find(n=>n.id===connecting?.a);if(!a)return;let r=canvas.getBoundingClientRect(),x=(ev.clientX-r.left-state.pan.x)/state.zoom,y=(ev.clientY-r.top-state.pan.y)/state.zoom;$('#wire-preview')?.setAttribute('d',`M${a.x+190} ${portY(a,connecting.port)} C${a.x+250} ${portY(a,connecting.port)},${x-70} ${y},${x} ${y}`)};const up=ev=>{window.removeEventListener('pointermove',move);let target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-port="in"]');if(target&&connecting){connectNodes(connecting.a,target.dataset.nodeId,connecting.port);connecting=null}else toast('Chọn cổng vào của node đích để hoàn tất liên kết');};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true});return}}if(ee){state.edgeSelected=ee.dataset.edge;state.selected=[];renderGraph();renderBottom();return}if(ne&&!spaceHeld&&e.button!==1){state.edgeSelected=null;let id=ne.dataset.node;if(e.shiftKey){state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id]}else if(!state.selected.includes(id)){state.selected=[id]}renderGraph();renderBottom();const start={x:e.clientX,y:e.clientY},positions=graph().nodes.filter(n=>state.selected.includes(n.id)).map(n=>({id:n.id,x:n.x,y:n.y}));let moved=false;const move=ev=>{if(!moved&&Math.abs(ev.clientX-start.x)+Math.abs(ev.clientY-start.y)>4){checkpoint();moved=true}if(!moved)return;let cr=canvas.getBoundingClientRect();if(ev.clientX<cr.left+24)state.pan.x+=7;if(ev.clientX>cr.right-24)state.pan.x-=7;if(ev.clientY<cr.top+24)state.pan.y+=7;if(ev.clientY>cr.bottom-24)state.pan.y-=7;positions.forEach(p=>{let n=graph().nodes.find(n=>n.id===p.id),x=p.x+(ev.clientX-start.x)/state.zoom,y=p.y+(ev.clientY-start.y)/state.zoom;n.x=state.snap?Math.round(x/10)*10:x;n.y=state.snap?Math.round(y/10)*10:y});renderGraph()};window.addEventListener('pointermove',move);window.addEventListener('pointerup',()=>{window.removeEventListener('pointermove',move);if(moved)save()},{once:true});return}if(e.shiftKey){let r=canvas.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;let m=document.createElement('div');m.className='marquee';canvas.append(m);let end={x:sx,y:sy};const move=ev=>{end={x:ev.clientX-r.left,y:ev.clientY-r.top};Object.assign(m.style,{left:Math.min(sx,end.x)+'px',top:Math.min(sy,end.y)+'px',width:Math.abs(end.x-sx)+'px',height:Math.abs(end.y-sy)+'px'})};window.addEventListener('pointermove',move);window.addEventListener('pointerup',()=>{window.removeEventListener('pointermove',move);m.remove();state.selected=graph().nodes.filter(n=>{let x=n.x*state.zoom+state.pan.x,y=n.y*state.zoom+state.pan.y;return x+190*state.zoom>=Math.min(sx,end.x)&&x<=Math.max(sx,end.x)&&y+112*state.zoom>=Math.min(sy,end.y)&&y<=Math.max(sy,end.y)}).map(n=>n.id);renderGraph();renderBottom()},{once:true});return}state.selected=[];state.edgeSelected=null;renderBottom();let sx=e.clientX,sy=e.clientY,p={...state.pan};const move=ev=>{state.pan={x:p.x+ev.clientX-sx,y:p.y+ev.clientY-sy};renderGraph()};window.addEventListener('pointermove',move);window.addEventListener('pointerup',()=>window.removeEventListener('pointermove',move),{once:true});renderGraph()};canvas.ondblclick=e=>{let n=e.target.closest('[data-node]');if(n){state.selected=[n.dataset.node];let data=selectedNode();if(data.type==='subflow')openSub(data.sub);else advancedNode()}else if(!e.target.closest('button'))addNodeMenu()}}
function connectNodes(a,b,p){if(a===b)return toast('Không nối node vào chính nó. Dùng node vòng lặp có giới hạn.');if(graph().edges.some(e=>e.a===a&&e.port===p))return toast('Cổng này đã có dây. Xóa dây hiện tại trước khi nối lại.');if(graph().nodes.find(n=>n.id===b)?.type==='start')return toast('Node Bắt đầu không nhận dây vào');checkpoint();graph().edges.push(edge(a,b,p));renderGraph();save();toast('Đã nối '+p+' → '+b)}
function renderDevices(){let online=devices.filter(d=>d.online).length;$('#main').innerHTML=`<div class="page"><div class="page-head"><div><div class="eyebrow">DEVICE WORKSPACE</div><h2>Dãy điện thoại</h2><p class="subtext">Chọn máy để thiết lập công việc hoặc mở Inspector.</p></div><div class="row">${btn('device-manager','settings','Quản lý thiết bị')}${btn('scan-devices','refresh','Làm mới','primary')}</div></div><div class="metric-grid">${[['Thiết bị mẫu',devices.length,'phone'],['Đang kết nối',online,'network'],['Tiến trình đã cấu hình',Object.keys(state.contexts).length+1,'workflow'],['Nội dung trong cấu hình',state.rows.length,'video']].map(([t,n,i])=>`<div class="card metric"><div class="row between"><span class="muted smalltext">${t}</span>${ic(i)}</div><div class="number">${n}</div><span class="tiny muted">Dữ liệu xem trước</span></div>`).join('')}</div><div class="toolbar"><div class="search" style="width:255px">${ic('search')}<input id="device-filter" placeholder="Tìm tên, model hoặc mã máy…"></div><span class="grow"></span><label class="row" style="margin:0">Kích thước <input id="device-size" type="range" min="170" max="320" value="205"></label>${btn('device-bulk','more','Thao tác nhóm','icon')}</div><div class="device-grid" id="device-grid">${devices.map((d,i)=>deviceCard(d,i)).join('')}</div><div class="notice" style="margin-top:20px">Bản HTML dùng ${devices.length} điện thoại mẫu. Bộ đếm lấy từ danh sách này; không đại diện thiết bị thực tế đang kết nối.</div></div>`;$('#device-filter').oninput=e=>{$$('.device-card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'':'none')};$('#device-size').oninput=e=>$('#device-grid').style.gridTemplateColumns=`repeat(auto-fill,minmax(${e.target.value}px,1fr))`}

function validation(){let errors=[],warnings=[],g=graph(),ids=new Set(g.nodes.map(n=>n.id));let starts=g.nodes.filter(n=>n.type==='start');if(starts.length!==1)errors.push('Cần đúng một node Bắt đầu.');if(!g.nodes.some(n=>['end','review'].includes(n.type)))errors.push('Thiếu node Kết thúc / Cần kiểm tra.');g.edges.forEach(e=>{if(!ids.has(e.a)||!ids.has(e.b))errors.push('Liên kết '+e.id+' có node không tồn tại.')});g.nodes.forEach(n=>{if(n.type!=='start'&&!g.edges.some(e=>e.b===n.id))warnings.push(n.name+': chưa có đường vào.');ports(n).forEach(p=>{if(!g.edges.some(e=>e.a===n.id&&e.port===p))errors.push(n.name+': thiếu nhánh '+({true:'Đúng',false:'Sai',error:'Lỗi',next:'Tiếp tục'}[p]));});if(['tap','type','read','find'].includes(n.type)&&!n.selector)warnings.push(n.name+': chưa có selector thực tế.');if(n.delayMin>n.delayMax)errors.push(n.name+': khoảng chờ nhỏ nhất lớn hơn lớn nhất.');if(n.type==='subflow'&&!state.graphs[n.sub])errors.push(n.name+': chưa chọn khối con.');if(n.effect&&n.retries>0)errors.push(n.name+': bước gửi / đăng phải tắt thử lại mù.');});let visited=new Set(),stack=new Set();function dfs(id){if(stack.has(id))return true;if(visited.has(id))return false;visited.add(id);stack.add(id);for(let e of g.edges.filter(e=>e.a===id)){if(dfs(e.b))return true}stack.delete(id);return false}if(starts[0]&&dfs(starts[0].id))errors.push('Có chu kỳ dây tự do. Dùng node vòng lặp với giới hạn thay vì nối vòng trực tiếp.');let recStack=new Set(),recSeen=new Set();function subCheck(key){if(recStack.has(key))return true;if(recSeen.has(key))return false;recSeen.add(key);recStack.add(key);for(let n of state.graphs[key]?.nodes||[]){if(n.sub&&subCheck(n.sub))return true}recStack.delete(key);return false}if(subCheck(state.graphKey))errors.push('Có lời gọi quy trình con đệ quy.');modal('Kiểm tra workflow',`<div class="row" style="margin-bottom:16px"><span class="badge ${errors.length?'red':'green'}">${errors.length} lỗi cấu trúc</span><span class="badge amber">${warnings.leng async function importDataFile(file){let text=await file.text(),data;try{if(file.name.endsWith('.json')){data=JSON.parse(text);if(!Array.isArray(data))throw Error('JSON phải là danh sách dòng')}else{let parsed=parseCSV(text.replace(/^\uFEFF/,'')),head=parsed.shift();data=parsed.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(head.map((k,i)=>[k.trim(),r[i]||''])))}let matches=[],unmatched=[];for(let d of data){let found=state.rows.filter(r=>d.id&&r.id===d.id);if(!found.length&&d.path&&d.file)found=state.rows.filter(r=>r.path+r.file===d.path+d.file);if(!found.length&&d.file)found=state.rows.filter(r=>r.file===d.file);if(found.length===1)matches.push({id:found[0].id,data:d});else unmatched.push(d.file||d.id||'Không có khóa')}window.pendingImport=matches;modal('Xem trước nhập dữ liệu',`<p><strong>${matches.length}</strong> dòng khớp · <strong>${unmatched.length}</strong> dòng không khớp / không rõ.</p><div class="notice">Chỉ cập nhật các cột caption, hashtags, comments và affiliate có trong tệp. Nội dung trống được hiểu là cố ý để trống.</div><table><thead><tr><th>ID nội dung</th><th>Caption mới</th></tr></thead><tbody>${matches.map(m=>`<tr><td>${esc(m.id)}</td><td>${esc(m.data.caption??'Giữ nguyên')}</td></tr>`).join('')}</tbody></table>${unmatched.length?'<p class="smalltext muted" style="margin-top:12px">Không nhập: '+unmatched.map(esc).join(', ')+'</p>':''}`,btn('modal-close',null,'Hủy')+btn('apply-import','check','Áp dụng dữ liệu','primary'),true)}catch(e){toast('Không đọc được dữ liệu: '+e.message)}}
async function addFiles(files){let valid=[...files].filter(f=>/\.(mp4|mov|mkv|webm|jpg|jpeg|png|webp)$/i.test(f.name));if(!valid.length)return toast('Không có video / ảnh phù hợp');let added=0;for(let f of valid){let relative=f.webkitRelativePath||f.name;if(state.rows.some(r=>r.localRef===relative&&r.size===f.size&&r.modified===f.lastModified))continue;state.rows.push({id:uid('content-'),file:f.name,caption:f.name.replace(/\.[^.]+$/,''),hashtags:'',comments:'',affiliate:'',duration:/\.(jpg|jpeg|png|webp)$/i.test(f.name)?'Ảnh':'Chưa đo',path:f.webkitRelativePath?f.webkitRelativePath.slice(0,-f.name.length):'Tệp được chọn/',localRef:relative,size:f.size,modified:f.lastModified,scheduled:'',status:'Chưa lên lịch',checked:false,files:1});added++}saveContext();save();if(state.view==='process')renderProcess();toast(`Đã nhập ${added} tệp. Trình duyệt chỉ lưu thông tin, không sao chép tệp sang Android.`)}

function sourceOptions(){modal('Tùy chọn nguồn nội dung',`<div class="checks">${[['subfolders','Quét cả thư mục con',false],['watcher','Tự theo dõi tệp mới (bản tích hợp)',false],['append','Tự xếp tệp mới vào các khung giờ tương lai',state.settings.autoAppend],['dedupe','Chống trùng theo nội dung + app + đối tượng',state.settings.dedupe]].map(([id,t,v])=>`<label class="checkbox-label"><input id="source-${id}" type="checkbox" ${v?'checked':''}>${t}</label>`).join('')}</div><div class="notice" style="margin-top:16px">Quét thư mục trong HTML cần bạn chọn lại tệp. Watcher nền, hash nội dung và truyền ADB cần bản desktop.</div>`,btn('modal-close',null,'Đóng')+btn('source-save','save','Lưu cấu hình','primary'))}

function help(){modal('Hướng dẫn & phím tắt',`<div class="notice">Bắt đầu: chọn điện thoại mẫu → mở Inspector → kéo node → chọn phần tử → nối cổng → sửa thuộc tính → chạy mô phỏng. Sang Tiến trình để thử nguồn dữ liệu và lịch.</div><table><thead><tr><th>Thao tác</th><th>Phím / cách dùng</th></tr></thead><tbody>${[['Lưu bản nháp','Ctrl+S'],['Hoàn tác / làm lại','Ctrl+Z / Ctrl+Y'],['Sao chép / dán / nhân bản','Ctrl+C / Ctrl+V / Ctrl+D'],['Chọn tất cả node','Ctrl+A khi canvas có focus'],['Tìm node trong thư viện','Ctrl+F'],['Đổi tên node / xóa','F2 / Delete'],['Phóng to theo con trỏ','Ctrl + cuộn chuột'],['Vừa canvas','Ctrl+0'],['Di chuyển canvas','Kéo nền / Space + kéo'],['Chọn nhiều node','Shift + bấm / Shift + kéo vùng'],['Mở quy trình con','Bấm đúp khối hoặc icon mở'],['Menu ngữ cảnh','Chuột phải node, dây hoặc canvas'],['Hủy nối dây / đóng hộp thoại','Esc']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table><p class="muted smalltext" style="margin-top:12px">Phím tắt chỉnh sửa không can thiệp khi đang gõ trong ô nhập. Undo không thu hồi thao tác đã thực hiện trên điện thoại thật.</p><button data-action="coverage" class="small">${ic('list')} Xem phạm vi chức năng bản HTML</button>`,null,true)}

function floatPhone(){let pane=$('#phone-pane');if(!pane)return;pane.classList.add('phone-floating');let h=$('.phone-heading',pane);h.classList.add('floating-handle');h.onpointerdown=e=>{if(e.target.closest('button,select'))return;let rect=pane.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;const move=ev=>{pane.style.left=Math.max(65,Math.min(innerWidth-100,rect.left+ev.clientX-sx))+'px';pane.style.top=Math.max(55,Math.min(innerHeight-100,rect.top+ev.clientY-sy))+'px';pane.style.right='auto'};window.addEventListener('pointermove',move);window.addEventListener('pointerup',()=>window.removeEventListener('pointermove',move),{once:true})}}
function popupPhone(){closeModal();if(currentPopup&&!currentPopup.closed){currentPopup.focus();return}currentPopup=window.open('','AutoReelsPhone','width=420,height=800,resizable=yes');if(!currentPopup){toast('Trình duyệt chặn popup. Đã chuyển điện thoại sang cửa sổ nổi trong tool.');state.phoneDock='floating';renderInspector();return}const style=$('style').textContent;currentPopup.document.write(`<!doctype html><html lang="vi"><meta charset="utf-8"><title>Điện thoại kiểm thử · ${esc(dev().name)}</title><style>${style}body{overflow:auto;background:#f3f5f9}.phone-pane{width:100%;max-width:none;height:100vh}.phone-device{width:300px;min-height:540px}</style><body>${phonePane()}<script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{window.opener.postMessage({type:'autoreels-phone-action',action:b.dataset.action},'*')});<\/script></body></html>`);currentPopup.document.close();currentPopup.onbeforeunload=()=>{currentPopup=null;toast('Popup đã đóng; điện thoại vẫn hiển thị trong Inspector')};toast('Đã mở điện thoại ở cửa sổ riêng')}
window.addEventListener('message',e=>{if(e.source===currentPopup&&e.data?.type==='autoreels-phone-action')action(e.data.action)});

case 'add-node':addNodeMenu();break;case 'duplicate':duplicateSelected();break;case 'copy':clipboard={nodes:clone(graph().nodes.filter(n=>state.selected.includes(n.id))),edges:clone(graph().edges.filter(e=>state.selected.includes(e.a)&&state.selected.includes(e.b)))};toast('Đã sao chép '+clipboard.nodes.length+' node');break;case 'paste':pasteNodes();break;

document.addEventListener('keydown',e=>{let typing=e.target.closest('input,textarea,select,[contenteditable]');if(e.key==='Escape'){closeModal();$('#context').innerHTML='';connecting=null;renderGraph();return}if(typing)return;if(e.code==='Space'){spaceHeld=true;e.preventDefault()}if(state.view!=='inspector')return;let ctrl=e.ctrlKey||e.metaKey;if(ctrl&&['s','z','y','c','v','d','a','f','0'].includes(e.key.toLowerCase())){e.preventDefault();switch(e.key.toLowerCase()){case 's':save();break;case 'z':e.shiftKey?redo():undo();break;case 'y':redo();break;case 'c':action('copy');break;case 'v':pasteNodes();break;case 'd':duplicateSelected();break;case 'a':action('select-all');break;case 'f':$('#node-search')?.focus();break;case '0':fit();break}}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSelected()}if(e.key==='F2'){e.preventDefault();action('rename-node')}});document.addEventListener('keyup',e=>{if(e.code==='Space')spaceHeld=false});
$('#folder-input').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('#media-input').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('#csv-input').onchange=e=>{if(e.target.files[0])importDataFile(e.target.files[0]);e.target.value=''};
$('#workflow-input').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(e.target.dataset.mode==='workspace'){if(data.format!=='autoreels-preview-workspace-v1'||!data.state?.graphs)throw Error('Không đúng cấu trúc workspace');stopRun(false);state=data.state;state.selected=[];state.edgeSelected=null;closeModal();document.body.classList.toggle('dark',state.settings.theme==='dark');render();save();toast('Đã khôi phục workspace')}else{if(data.format!=='autoreels-preview-workflow-v1'||!data.graphs?.main||!data.workflow)throw Error('Không đúng cấu trúc workflow');let id=uid('w');state.workflows.push({...data.workflow,id,name:data.workflow.name+' · Nhập'});state.graphs['wf:'+id]=clone(data.graphs.main);for(let [k,g] of Object.entries(data.graphs))if(k!=='main'&&!k.startsWith('wf:')&&!state.graphs[k])state.graphs[k]=g;openWorkflow(id);toast('Đã nhập workflow')}}catch(err){toast('Không nhập được: '+err.message)}e.target.value=''};
window.addEventListener('beforeunload',()=>{try{localStorage.setItem('autoreels-studio-preview-v1',JSON.stringify(state))}catch{}});

// Extra canvas gestures use capture so they do not start a node drag.
document.addEventListener('pointerdown',e=>{
 let size=e.target.closest('[data-size]'),rer=e.target.closest('[data-reroute]');
 if(size){e.stopPropagation();e.preventDefault();checkpoint();let n=graph().nodes.find(n=>n.id===size.dataset.size),sx=e.clientX,sy=e.clientY,w=n.w||190,h=n.h||112;let move=ev=>{n.w=Math.max(180,w+(ev.clientX-sx)/state.zoom);n.h=Math.max(112,h+(ev.clientY-sy)/state.zoom);renderGraph()};window.addEventListener('pointermove',move);window.addEventListener('pointerup',()=>{window.removeEventListener('pointermove',move);save()},{once:true})}
 if(rer){e.stopPropagation();e.preventDefault();checkpoint();let ed=graph().edges.find(ed=>ed.id===rer.dataset.reroute),rect=$('#canvas').getBoundingClientRect();let move=ev=>{ed.reroute={x:(ev.clientX-rect.left-state.pan.x)/state.zoom,y:(ev.clientY-rect.top-state.pan.y)/state.zoom};renderGraph()};window.addEventListener('pointermove',move);window.addEventListener('pointerup',()=>{window.removeEventListener('pointermove',move);save()},{once:true})}
},true);
document.addEventListener('click',e=>{let b=e.target.closest('[data-toggle-group]');if(b){checkpoint();let g=graph().groups.find(g=>g.id===b.dataset.toggleGroup);g.collapsed=!g.collapsed;renderGraph();save()}});

// A workflow owns its complete graph set and input schema. App-specific edits never leak.
function rememberDefinition(){state.workflowBundles=state.workflowBundles||{};state.workflowBundles[state.workflow]={graphs:clone(Object.fromEntries(Object.entries(state.graphs).filter(([k])=>!k.startsWith('wf:')))),inputs:clone(state.inputs)}}
function getDefinition(id){if(state.workflowBundles?.[id])return clone(state.workflowBundles[id]);let w=state.workflows.find(w=>w.id===id),g={main:state.graphs['wf:'+id]?clone(state.graphs['wf:'+id]):mainGraph(w.app),account:makeSub('account'),page:makeSub('page'),compose:makeSub('compose'),comment:makeSub('comment')};let fields=[{key:'video',type:'file',scope:'row',required:true},{key:'caption',type:'text',scope:'row',required:true},{key:'hashtags',type:'text',scope:'row',required:false},{key:'comments',type:'list',scope:'row',required:false},{key:'affiliate',type:'url',scope:'row',required:false},{key:'accountId',type:'identity',scope:'process',required:true},{key:'targetId',type:'identity',scope:'process',required:true}];if(w.app!=='fb'&&w.app!=='lite'){for(let n of g.page.nodes)n.name=n.name.replaceAll('fanpage','hồ sơ');let n=g.compose.nodes.find(n=>n.id==='s2');if(n)n.name=w.app==='ig'?'Mở nút tạo trên Instagram':w.app==='tt'?'Mở trình tạo TikTok':'Mở soạn bài Threads';let n3=g.compose.nodes.find(n=>n.id==='s3');if(n3)n3.name=w.app==='ig'?'Chọn loại Reel / video':w.app==='tt'?'Mở nguồn tải nội dung':'Chọn tệp đính kèm';for(let n of [...g.main.nodes,...g.compose.nodes,...g.account.nodes,...g.page.nodes,...g.comment.nodes]){n.selector='';if(n.type==='tap')n.description='Chọn phần tử trên app '+apps.find(a=>a.id===w.app).name+' khi kiểm thử';}}
if(w.id==='w2'){fields[0]={key:'images',type:'file[]',scope:'row',required:true};for(let n of [...g.main.nodes,...g.compose.nodes]){n.name=n.name.replaceAll('video','ảnh');n.value=n.value.replaceAll('row.video','row.images');}}
if(w.app==='th'){fields=fields.filter(f=>f.key!=='video');g.main.nodes=g.main.nodes.filter(n=>!['n2','n12'].includes(n.id));g.main.edges=g.main.edges.filter(e=>!['n2','n12'].includes(e.a)&&!['n2','n12'].includes(e.b));g.main.edges.push(edge('n1','n3'),edge('n10','n13','false'),edge('n11','n13'));g.compose.nodes=g.compose.nodes.filter(n=>!['s3','s4','s5'].includes(n.id));g.compose.edges=g.compose.edges.filter(e=>!['s3','s4','s5'].includes(e.a)&&!['s3','s4','s5'].includes(e.b));g.compose.edges.push(edge('s2','s6'));}
return {graphs:g,inputs:fields}}
const originalOpenWorkflow=openWorkflow;openWorkflow=function(id){if(id===state.workflow){originalOpenWorkflow(id);return}rememberDefinition();const bundle=getDefinition(id);originalOpenWorkflow(id);state.graphs=bundle.graphs;state.inputs=bundle.inputs;state.graphKey='main';render();fit();save()};
const originalSwitchContext=switchContext;switchContext=function(changes){let bundle;if(changes.workflow&&changes.workflow!==state.workflow){rememberDefinition();bundle=getDefinition(changes.workflow)}originalSwitchContext(changes);if(bundle){state.graphs=bundle.graphs;state.inputs=bundle.inputs;state.graphKey='main';render();save()}};
function dynamicColumns(){if(!$('#content-table'))return;$$('[data-extra-header]').forEach(e=>e.remove());const media=state.inputs.some(f=>f.scope==='row'&&['file','file[]'].includes(f.type)),keys=new Set(state.inputs.filter(f=>f.scope==='row').map(f=>f.key));const mapping={3:'caption',4:'hashtags',6:'comments',7:'affiliate'};const trs=$$('#content-table tr');trs.forEach(tr=>{for(let [idx,k] of Object.entries(mapping))if(tr.children[+idx])tr.children[+idx].style.display=keys.has(k)?'':'none';[5,8].forEach(i=>{if(tr.children[i])tr.children[i].style.display=media?'':'none'})});$$('[data-action="folder"],[data-action="media"]').forEach(b=>b.style.display=media?'':'none');const extras=state.inputs.filter(f=>f.scope==='row'&&!['video','images','caption','hashtags','comments','affiliate'].includes(f.key));if(!extras.length)return;let head=$('#content-table thead tr');for(let f of extras){let th=document.createElement('th');th.dataset.extraHeader=f.key;th.textContent=f.key+(f.required?' *':'');head.insertBefore(th,head.lastElementChild)}$$('#content-rows tr[data-row]').forEach(tr=>{let r=state.rows.find(r=>r.id===tr.dataset.row);for(let f of extras){let td=document.createElement('td'),inp=document.createElement('input');inp.type=f.type==='number'?'number':f.type==='boolean'?'checkbox':'text';inp.value=r[f.key]??'';if(f.type==='boolean')inp.checked=!!r[f.key];inp.placeholder=f.type;inp.onchange=()=>{r[f.key]=f.type==='boolean'?inp.checked:f.type==='number'?+inp.value:inp.value;saveContext();save()};td.append(inp);tr.insertBefore(td,tr.lastElementChild)}})}
const originalRenderRows=renderRows;renderRows=function(){originalRenderRows();dynamicColumns()};
// Extra process fields declared by workflows remain configurable outside row data.
const originalRenderProcess=renderProcess;renderProcess=function(){originalRenderProcess();let extras=state.inputs.filter(f=>f.scope==='process'&&!['accountId','targetId'].includes(f.key));if(!extras.length)return;state.processFields=state.processFields||{};let host=$('.setup-grid'),box=document.createElement('div');box.className='full';box.style.gridColumn='1/-1';box.innerHTML='<div class="form-grid">'+extras.map(f=>`<div><label>${esc(f.key)} ${f.required?'*':''}</label><input data-process-extra="${esc(f.key)}" value="${esc(state.processFields[contextKey()]?.[f.key]||'')}" placeholder="${esc(f.type)}"></div>`).join('')+'</div>';host.append(box);$$('[data-process-extra]').forEach(e=>e.onchange=()=>{state.processFields[contextKey()]=state.processFields[contextKey()]||{};state.processFields[contextKey()][e.dataset.processExtra]=e.value;save()})};
render();if(state.view==='inspector')setTimeout(fit,80);
